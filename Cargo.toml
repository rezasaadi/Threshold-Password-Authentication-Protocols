[package]
name = "upspa-unified-benchmark"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
publish = false

[[bin]]
name = "bench_unified"
path = "src/bin/bench_unified.rs"

[dependencies]
augsso_bench = { path = "crates/augsso" }
curve25519-dalek = { version = "4", features = ["alloc", "rand_core"] }
pastau_bench = { path = "crates/pastau" }
rand_chacha = "0.3"
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
bls12_381 = "0.8"
ed25519-dalek = { version = "2", features = ["rand_core"] }
upspa_bench = { path = "crates/upspa" }
upspa_quorum_bench = { path = "crates/upspa-quorum" }

[workspace]
members = [
    ".",
    "crates/augsso",
    "crates/pastau",
    "crates/upspa",
    "crates/upspa-quorum",
    "pastau_paper",
]
resolver = "2"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
