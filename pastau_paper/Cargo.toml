[package]
name = "pastau_paper"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
aes = "0.8"
ofb = "0.6"
cipher = "0.4"
hex = "0.4"
num-bigint = { version = "0.4", features = ["rand", "serde"] }
num-integer = "0.1"
num-traits = "0.2"
openssl = "0.10"
rand = "0.8"
rand_chacha = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
